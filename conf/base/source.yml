# Источники данных
#
# path   — директория, где лежат файлы сплитов
# splits — glob-шаблон относительно path; файлы (train-*.parquet) или поддиректория (train/)

data:
  wikitext:
    kind: parquet
    path: data/raw/wikitext/wikitext-103-raw-v1
    splits:
      train: "train*"
      validation: "validation*"
      test: "test*"
    column_map:
      text: text
