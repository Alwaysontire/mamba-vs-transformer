# Конфиг kedro-mlflow


server: 
  mlflow_tracking_uri: null
  mlflow_registry_uri: null
  credentials: null

tracking:
  disable_tracking:
    pipelines: [data_processing, compare]
  experiment: 
    name: mamba-vs-transformer
  run:
    id: ${runenv:RUN_ID, null}
    name: ${globals:run_name}
    nested: false
  params: 
    dict_params: 
      flatten: true
      recursive: true
      sep: "."
    