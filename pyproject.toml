[project]
name = "mamba-vs-transformer"
version = "0.1.0"
requires-python = ">=3.10,<3.11"

dependencies = [
    "pydantic>=2.5",
    "omegaconf>=2.3",
    "python-dotenv",
    "pandas",
    "pyarrow",
    "numpy",
    "mlflow",
    "plotly>=5.18",
    "scikit-learn>=1.3",
    "kedro>=0.19,<0.20",
    "kedro-datasets[pandas]",
    "kedro-mlflow>=0.13,<0.14",
    "transformers==5.15.1",
    "torch>=2.1,<2.7",

]

[tool.kedro]
package_name = "src"
project_name = "mamba-vs-transformer"
kedro_init_version = "0.19.12"
source_dir = "."
[tool.kedro_telemetry]
project_id = "b6a830b2e8774370a09d25d682927ace"
