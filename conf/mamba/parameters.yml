# Env mamba: uv run kedro run --env mamba
#
# ~29.8M параметров без эмбеддингов

model:
  arch: mamba
  vocab_size: 50257        # GPT-2 токенизатор
  d_model: 512
  n_layers: 18
  max_length: 1024
  dropout: 0.0
  tie_embeddings: true
  block:
    d_state: 64
    d_conv: 4
    expand: 2
    headdim: 64
    ngroups: 1
    chunk_size: 256
